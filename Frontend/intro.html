<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetClick - Welcome</title>
  <link rel="stylesheet" href="intro.css">
</head>
<body class="intro-screen">

  <button class="skip-btn" id="skipBtn">Skip Intro</button>

  <div class="intro-container" id="introContainer">

    <div class="wipe-scene" id="wipeScene">
      <div class="wipe-wordmark">
        <span class="wipe-letter" style="--i:0">N</span>
        <span class="wipe-letter" style="--i:1">E</span>
        <span class="wipe-letter" style="--i:2">T</span>
        <span class="wipe-letter red-letter" style="--i:3">C</span>
        <span class="wipe-letter red-letter" style="--i:4">L</span>
        <span class="wipe-letter red-letter" style="--i:5">I</span>
        <span class="wipe-letter red-letter" style="--i:6">C</span>
        <span class="wipe-letter red-letter" style="--i:7">K</span>
      </div>

      <div class="sweep-line" id="sweepLine"></div>

      <p class="tagline" id="tagline">Your personalised cinema</p>
    </div>

  </div>

  <div class="login-panel hidden" id="loginPanel">
    <div class="login-card">
      <div class="login-logo">NET<span class="red">CLICK</span></div>
      <p class="login-sub">Discover movies tailored just for you</p>
      <button class="btn-primary" id="proceedBtn">Continue to Login</button>
      <button class="btn-back" id="backBtn">&#8592; Back</button>
    </div>
  </div>

  <script src="intro.js"></script>
</body>
</html>
